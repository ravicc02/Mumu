<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 答题助手</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">AI</div>
      <div class="brand-copy">
        <h1>答题助手</h1>
        <p id="tabLabel">当前页面</p>
      </div>
      <span id="serverBadge" class="badge badge-neutral">检测中</span>
    </header>

    <main>
      <section class="server-strip" aria-label="本地服务设置">
        <label class="sr-only" for="serverUrl">本地服务地址</label>
        <input id="serverUrl" type="url" value="http://127.0.0.1:8787" spellcheck="false">
        <button id="checkServer" class="button button-ghost button-compact" type="button">检测</button>
      </section>

      <div id="status" class="status status-neutral" role="status" aria-live="polite">
        等待扫描
      </div>

      <section class="action-grid" aria-label="答题操作">
        <button id="scanPage" class="button button-primary" type="button">授权并扫描</button>
        <button id="getAnswer" class="button button-secondary" type="button" disabled>获取答案</button>
        <button id="applyAnswer" class="button button-accent" type="button" disabled>填入答案</button>
        <button id="nextQuestion" class="button button-secondary" type="button" disabled>下一题</button>
      </section>

      <section id="questionSection" class="panel" hidden>
        <div class="panel-heading">
          <div>
            <span class="eyebrow">当前题目</span>
            <h2 id="questionTitle">未命名题目</h2>
          </div>
          <span id="questionType" class="badge badge-neutral">未知</span>
        </div>
        <div id="questionNavigator" class="question-navigator" hidden>
          <label for="questionPicker">题目</label>
          <select id="questionPicker"></select>
          <span id="questionCount" class="meta-text"></span>
        </div>
        <ol id="optionList" class="option-list"></ol>
      </section>

      <section id="answerSection" class="panel answer-panel" hidden>
        <div class="panel-heading">
          <div>
            <span class="eyebrow">建议答案</span>
            <h2 id="answerTitle">等待生成</h2>
          </div>
          <span id="confidenceBadge" class="badge badge-neutral">--</span>
        </div>
        <p id="answerText" class="answer-text"></p>
        <p id="answerExplanation" class="answer-explanation"></p>
        <div class="answer-footer">
          <span id="answerModel" class="meta-text"></span>
          <button id="discardAnswer" class="text-button" type="button">清除</button>
        </div>
      </section>

      <section class="panel assignment-panel">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">2026 学年</span>
            <h2>当前可提交作业</h2>
          </div>
          <span id="assignmentBadge" class="badge badge-neutral">未同步</span>
        </div>
        <div class="assignment-actions">
          <button id="syncAssignments" class="button button-primary" type="button">同步未完成作业</button>
          <button id="toggleAutoSync" class="button button-secondary" type="button">自动检测：关闭</button>
        </div>
        <p id="assignmentSyncStatus" class="meta-text assignment-sync-status">尚未同步</p>
        <div id="assignmentList" class="assignment-list"></div>
      </section>

      <details id="rulesPanel" class="settings-panel">
        <summary>站点规则</summary>
        <div class="field-stack">
          <label>
            <span>题目容器</span>
            <input id="questionSelector" type="text" placeholder="[data-question]" spellcheck="false">
          </label>
          <label>
            <span>题干</span>
            <input id="stemSelector" type="text" placeholder=".stem" spellcheck="false">
          </label>
          <label>
            <span>选项</span>
            <input id="optionSelector" type="text" placeholder="label.option" spellcheck="false">
          </label>
          <label>
            <span>下一题按钮</span>
            <input id="nextSelector" type="text" placeholder="#next" spellcheck="false">
          </label>
          <label>
            <span>题型</span>
            <select id="questionTypeMode">
              <option value="">自动判断</option>
              <option value="single_choice">单选题</option>
              <option value="multiple_choice">多选题</option>
              <option value="text">文本题</option>
            </select>
          </label>
          <button id="saveRules" class="button button-secondary" type="button">保存当前站点规则</button>
        </div>
      </details>
    </main>

    <script src="sidepanel.js"></script>
  </body>
</html>
