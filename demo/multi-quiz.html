<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>多题与富文本编辑器测试</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f5f1;
        --surface: #fff;
        --ink: #17201a;
        --muted: #677169;
        --line: #d9dfd9;
        --green: #176b45;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(820px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 60px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 30px;
        letter-spacing: 0;
      }

      .questionLi {
        margin-bottom: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 22px;
      }

      .mark_name {
        margin: 0 0 14px;
        font-size: 18px;
        line-height: 1.55;
      }

      .option {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
      }

      textarea {
        width: 100%;
        min-height: 130px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        font: inherit;
      }

      iframe {
        width: 100%;
        height: 180px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }

      .hint {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>多题识别测试</h1>
      <p class="hint">本页包含 4 道混排题，用于验证批量扫描和不同输入控件。</p>

      <section id="question1001" class="questionLi">
        <h3 class="mark_name">1. Manifest V3 的后台脚本使用什么工作线程？</h3>
        <label class="option"><input type="radio" name="q1" value="0"><span>Service Worker</span></label>
        <label class="option"><input type="radio" name="q1" value="1"><span>Content Script</span></label>
      </section>

      <section id="question1002" class="questionLi">
        <h3 class="mark_name">2. 以下哪些是 Chrome 扩展权限？</h3>
        <label class="option"><input type="checkbox" name="q2" value="0"><span>storage</span></label>
        <label class="option"><input type="checkbox" name="q2" value="1"><span>scripting</span></label>
        <label class="option"><input type="checkbox" name="q2" value="2"><span>sidePanel</span></label>
      </section>

      <section id="question1003" class="questionLi">
        <h3 class="mark_name">3. 用一句话说明为什么扩展不应上传 Cookie。</h3>
        <textarea name="answer1003" placeholder="请输入答案"></textarea>
      </section>

      <section id="question1004" class="questionLi" typename="设计题">
        <h3 class="mark_name">4. 用 PlantUML 描述一个简单的登录顺序图。</h3>
        <iframe id="ueditor_0" title="富文本编辑器" srcdoc="<!doctype html><html><body contenteditable='true'></body></html>"></iframe>
        <textarea id="answer1004" name="answer1004" style="display:none"></textarea>
      </section>
    </main>
  </body>
</html>
