<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>浏览器扩展知识测验</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f5f1;
        --surface: #ffffff;
        --ink: #17201a;
        --muted: #677169;
        --line: #d9dfd9;
        --green: #176b45;
        --green-soft: #e5f3eb;
        --orange: #a34f08;
        --orange-soft: #fff0dd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .site-header {
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .site-header-inner,
      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 62px;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
      }

      .brand-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--green);
      }

      .header-meta {
        color: var(--muted);
        font-size: 12px;
      }

      main {
        padding: 34px 0 50px;
      }

      .quiz-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
      }

      .quiz-heading h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .progress-copy {
        flex: none;
        color: var(--muted);
        font-size: 12px;
      }

      .progress-track {
        height: 5px;
        margin-bottom: 20px;
        overflow: hidden;
        border-radius: 999px;
        background: #dfe5df;
      }

      .progress-bar {
        width: 0;
        height: 100%;
        background: var(--green);
        transition: width 180ms ease;
      }

      .question-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: clamp(20px, 5vw, 34px);
        box-shadow: 0 1px 3px rgba(23, 32, 26, 0.06);
      }

      .question-kicker {
        margin-bottom: 8px;
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .stem {
        margin: 0 0 22px;
        font-size: 21px;
        line-height: 1.5;
      }

      .option-list {
        display: grid;
        gap: 9px;
      }

      .option {
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 13px 14px;
        cursor: pointer;
        line-height: 1.5;
        transition: border-color 120ms ease, background-color 120ms ease;
      }

      .option:hover {
        border-color: #aab8ad;
        background: #fbfcfa;
      }

      .option:has(input:checked) {
        border-color: #8bc3a5;
        background: var(--green-soft);
      }

      .option input {
        width: 16px;
        height: 16px;
        margin: 2px 0 0;
        accent-color: var(--green);
      }

      textarea {
        min-height: 130px;
        width: 100%;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 12px;
        color: var(--ink);
        background: #fff;
        font: inherit;
        line-height: 1.55;
        outline: none;
      }

      textarea:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(23, 107, 69, 0.12);
      }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 24px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }

      .message {
        min-height: 20px;
        color: var(--orange);
        font-size: 12px;
      }

      .next {
        min-width: 104px;
        min-height: 40px;
        border: 0;
        border-radius: 7px;
        padding: 8px 16px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .completion {
        border: 1px solid #bcd9c9;
        border-radius: 8px;
        background: var(--green-soft);
        padding: clamp(24px, 6vw, 46px);
      }

      .completion h2 {
        margin: 0 0 8px;
      }

      .completion p {
        margin: 0;
        color: var(--green);
      }

      @media (max-width: 540px) {
        main {
          padding-top: 24px;
        }

        .quiz-heading h1 {
          font-size: 26px;
        }

        .quiz-heading {
          align-items: start;
          flex-direction: column;
          gap: 8px;
        }

        .card-footer {
          align-items: stretch;
          flex-direction: column;
        }

        .next {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>扩展知识测验</span>
        </div>
        <span class="header-meta">本地示例</span>
      </div>
    </header>

    <main>
      <div class="quiz-heading">
        <h1>浏览器扩展基础</h1>
        <span id="progressCopy" class="progress-copy">第 1 题 / 共 3 题</span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="quizRoot"></div>
    </main>

    <script>
      const questions = [
        {
          type: "single",
          title: "Manifest V3 扩展的后台脚本通常使用哪一种工作线程？",
          options: [
            "Service Worker",
            "Content Script",
            "Popup Page",
            "Renderer Thread"
          ]
        },
        {
          type: "multiple",
          title: "以下哪些是浏览器扩展可以申请的权限？",
          options: [
            "storage",
            "scripting",
            "sidePanel",
            "rootAccess"
          ]
        },
        {
          type: "text",
          title: "用一句话说明：为什么扩展不应把网站 Cookie 上传到远程服务？"
        }
      ];

      const quizRoot = document.querySelector("#quizRoot");
      const progressCopy = document.querySelector("#progressCopy");
      const progressBar = document.querySelector("#progressBar");
      let currentIndex = 0;

      function renderQuestion() {
        const question = questions[currentIndex];
        progressCopy.textContent = `第 ${currentIndex + 1} 题 / 共 ${questions.length} 题`;
        progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

        const article = document.createElement("article");
        article.className = "question-card";
        article.dataset.aqaQuestion = "";

        const kicker = document.createElement("div");
        kicker.className = "question-kicker";
        kicker.textContent = question.type === "multiple"
          ? "多选题"
          : question.type === "text"
            ? "文本题"
            : "单选题";

        const stem = document.createElement("h2");
        stem.className = "stem";
        stem.textContent = question.title;

        article.append(kicker, stem);

        if (question.type === "text") {
          const textarea = document.createElement("textarea");
          textarea.name = "answer";
          textarea.placeholder = "输入你的回答";
          article.append(textarea);
        } else {
          const list = document.createElement("div");
          list.className = "option-list";
          question.options.forEach((optionText, optionIndex) => {
            const label = document.createElement("label");
            label.className = "option";
            const input = document.createElement("input");
            input.type = question.type === "multiple" ? "checkbox" : "radio";
            input.name = `question-${currentIndex}`;
            input.value = String(optionIndex);
            const text = document.createElement("span");
            text.textContent = optionText;
            label.append(input, text);
            list.append(label);
          });
          article.append(list);
        }

        const footer = document.createElement("div");
        footer.className = "card-footer";
        const message = document.createElement("div");
        message.className = "message";
        const next = document.createElement("button");
        next.id = "next";
        next.className = "next";
        next.type = "button";
        next.textContent = currentIndex === questions.length - 1 ? "提交演示" : "下一题";
        next.addEventListener("click", handleNext);
        footer.append(message, next);
        article.append(footer);
        quizRoot.replaceChildren(article);
      }

      function hasResponse() {
        const question = questions[currentIndex];
        if (question.type === "text") {
          return Boolean(document.querySelector("textarea")?.value.trim());
        }
        return Boolean(document.querySelector("input:checked"));
      }

      function handleNext() {
        if (!hasResponse()) {
          document.querySelector(".message").textContent = "请先填写或选择答案";
          return;
        }

        if (currentIndex === questions.length - 1) {
          progressCopy.textContent = "已完成";
          progressBar.style.width = "100%";
          const completion = document.createElement("section");
          completion.className = "completion";
          completion.innerHTML = "<h2>演示已完成</h2><p>提交动作由示例页面模拟，没有发送数据。</p>";
          quizRoot.replaceChildren(completion);
          return;
        }

        currentIndex += 1;
        renderQuestion();
      }

      renderQuestion();
    </script>
  </body>
</html>
