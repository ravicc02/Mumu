name: Windows Installer Diagnostic
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to reproduce without changing release artifacts
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: npm --prefix desktop ci
      - run: python -m pip install -r backend/requirements.txt
      - run: npm --prefix desktop run build:win
      - name: Reproduce silent installer and capture crash events
        shell: pwsh
        run: |
          $start = Get-Date
          $installer = (Get-ChildItem desktop/release/*-setup.exe | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP ('mumu-install-diagnostic-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $target | Out-Null
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', ('/D=' + $target)) -PassThru -Wait
          "ExitCode=$($process.ExitCode)" | Out-File desktop/release/installer-diagnostic.txt
          "ExecutableExists=$(Test-Path (Join-Path $target 'Mumu.exe'))" | Out-File desktop/release/installer-diagnostic.txt -Append
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$start} -ErrorAction SilentlyContinue |
            Where-Object { $_.Id -in @(1000,1001) } |
            Select-Object TimeCreated,Id,ProviderName,Message | Format-List |
            Out-File desktop/release/installer-events.txt
          Get-Content desktop/release/installer-diagnostic.txt
          Get-Content desktop/release/installer-events.txt
          if ($process.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: installer-diagnostic
          retention-days: 3
          path: |
            desktop/release/*-setup.exe
            desktop/release/installer-diagnostic.txt
            desktop/release/installer-events.txt
