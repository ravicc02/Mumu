name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.5.0-rc.1)
        required: true
        type: string
      publish:
        description: Publish after building, smoke testing and verifying downloads
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: backend
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate clean source and editable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          node scripts/release.mjs check --release --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/github-release.mjs guard $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run audit:source
      - run: npm --prefix desktop ci
      - run: python -m pip install -r backend/requirements.txt
      - name: Install isolated test browser
        shell: pwsh
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $browserPath = python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ANSWER_STUDIO_CHROME_PATH=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANSWER_STUDIO_DATA=$env:RUNNER_TEMP/studio-release-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm test
      - run: npm run test:desktop
      - run: python -m unittest discover -s backend/test -v
      - run: npm --prefix desktop run build:win
      - name: Smoke test the packaged application
        shell: pwsh
        run: ./scripts/smoke-package.ps1
      - name: Create notes, provenance and checksums
        shell: pwsh
        run: |
          node scripts/release.mjs notes --out desktop/release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File desktop/release/build-environment.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release.mjs manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release.mjs verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ inputs.tag || github.ref_name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            desktop/release/Assignment-Studio-*-windows-x64-setup.exe
            desktop/release/SHA256SUMS.txt
            desktop/release/release-manifest.json
            desktop/release/RELEASE_NOTES.md
            desktop/release/build-environment.txt
            desktop/release/smoke-result.json
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: node scripts/github-release.mjs draft $env:RELEASE_TAG
      - name: Download, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        run: node scripts/github-release.mjs publish $env:RELEASE_TAG
