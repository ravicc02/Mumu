name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.6.0-rc.1)
        required: true
        type: string
      publish:
        description: Publish after building, smoke testing and verifying downloads
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: backend
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate clean source and editable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          node scripts/release.mjs check --release --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/github-release.mjs guard $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run audit:source
      - run: npm --prefix desktop ci
      - run: python -m pip install -r backend/requirements.txt
      - name: Install isolated test browser
        shell: pwsh
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $browserPath = python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MUMU_CHROME_PATH=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUMU_DATA=$env:RUNNER_TEMP/mumu-release-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm test
      - run: npm run test:desktop
      - run: python -m unittest discover -s backend/test -v
      - run: npm --prefix desktop run build:win
      - name: Smoke test the packaged application
        shell: pwsh
        run: ./scripts/smoke-package.ps1
      - name: Install and verify the first-run experience
        shell: pwsh
        run: node scripts/smoke-installed.mjs
      - name: Create notes, provenance and checksums
        shell: pwsh
        run: |
          node scripts/release.mjs notes --out desktop/release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File desktop/release/build-environment.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release.mjs manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release.mjs verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ inputs.tag || github.ref_name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            desktop/release/Mumu-*-windows-x64-setup.exe
            desktop/release/SHA256SUMS.txt
            desktop/release/release-manifest.json
            desktop/release/RELEASE_NOTES.md
            desktop/release/build-environment.txt
            desktop/release/smoke-result.json
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: node scripts/github-release.mjs draft $env:RELEASE_TAG
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: backend
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsecret-1-0 libsecret-1-dev libsecret-tools gnome-keyring dbus-x11 libgtk-3-0 libnss3 libxss1 libxtst6 libnotify4 libgbm1 libasound2 xdg-utils xvfb xauth weston dpkg
      - name: Validate clean source and editable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs check --release --tag "$RELEASE_TAG"
          node scripts/github-release.mjs guard "$RELEASE_TAG"
          npm run audit:source
      - run: npm --prefix desktop ci
      - run: python -m pip install -r backend/requirements.txt
      - name: Install isolated Chromium and run Linux regressions
        run: |
          python -m playwright install --with-deps chromium
          export MUMU_CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm test
          npm run test:desktop
          MUMU_DATA="$RUNNER_TEMP/mumu-linux-tests" xvfb-run -a npm run test:backend
      - name: Build Linux AppImage and deb
        run: npm --prefix desktop run build:linux
      - name: Verify installed deb, AppImage, X11, Wayland and Secret Service
        run: |
          sudo dpkg -i desktop/release/Mumu-*-linux-amd64.deb
          dbus-run-session -- xvfb-run -a bash scripts/smoke-linux-session.sh
      - name: Create Linux notes, manifest and checksums
        run: |
          node scripts/release-linux.mjs notes --dir desktop/release
          python -m pip freeze > desktop/release/build-environment-linux-x64.txt
          node scripts/release-linux.mjs manifest --dir desktop/release
          node scripts/release-linux.mjs verify --dir desktop/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ inputs.tag || github.ref_name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            desktop/release/Mumu-*-linux-x64.AppImage
            desktop/release/Mumu-*-linux-amd64.deb
            desktop/release/SHA256SUMS-linux-x64.txt
            desktop/release/release-manifest-linux-x64.json
            desktop/release/RELEASE_NOTES.md
            desktop/release/build-environment-linux-x64.txt
            desktop/release/smoke-linux-result.json
      - name: Add Linux assets to the release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs linux-draft "$RELEASE_TAG"

  linux-install-ubuntu24:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: backend
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Download the Ubuntu 22.04 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "linux-$RELEASE_TAG" --dir desktop/release
          node scripts/release-linux.mjs verify --dir desktop/release
      - name: Install desktop session and deb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsecret-tools gnome-keyring dbus-x11 xvfb xauth weston ./desktop/release/Mumu-*-linux-amd64.deb
          chmod +x desktop/release/Mumu-*-linux-x64.AppImage
      - name: Verify the published package formats on Ubuntu 24.04
        run: dbus-run-session -- xvfb-run -a bash scripts/smoke-linux-session.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-ubuntu24-${{ inputs.tag || github.ref_name }}
          retention-days: 7
          if-no-files-found: error
          path: desktop/release/smoke-linux-result.json

  publish:
    needs: [windows, linux, linux-install-ubuntu24]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Publish verified Windows and Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs publish "$RELEASE_TAG"
