<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>扫码签到 · Mumu</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-muted: #edf0f4;
      --ink: #1c232b;
      --muted: #596370;
      --subtle: #6f7a86;
      --line: #e0e4e9;
      --line-strong: #cbd2da;
      --accent: #3157d5;
      --accent-hover: #2747b6;
      --accent-soft: #edf1ff;
      --green: #1b7550;
      --green-soft: #e8f4ed;
      --orange: #94620f;
      --orange-soft: #fbf2de;
      --red: #b6413b;
      --red-soft: #fbedeb;
      --radius: 6px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 60px;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 8px; flex: none; }
    .brand img { width: 28px; height: 28px; display: block; }
    .brand span { font-size: 15px; font-weight: 650; letter-spacing: 0; }
    .header-divider { width: 1px; height: 20px; background: var(--line); }
    .header-title { min-width: 0; flex: 1; font-size: 14px; font-weight: 500; }
    .badge {
      flex: none;
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 9px;
      color: var(--muted);
      background: var(--surface-muted);
      font-size: 12px;
      font-weight: 500;
    }
    .badge.live { color: var(--accent); background: var(--accent-soft); }
    .badge.success { color: var(--green); background: var(--green-soft); }
    .badge.warn { color: var(--orange); background: var(--orange-soft); }
    .badge.error { color: var(--red); background: var(--red-soft); }
    main {
      width: min(100%, 620px);
      min-height: calc(100dvh - 60px);
      margin: 0 auto;
      background: var(--surface);
      border-inline: 1px solid var(--line);
    }
    .pin-panel { display: none; padding: 32px 20px; }
    .locked .pin-panel { display: block; }
    .locked .content { display: none; }
    .pin-panel h1 { margin: 0 0 18px; font-size: 21px; line-height: 1.35; letter-spacing: 0; }
    .field { display: grid; gap: 7px; }
    .field span { color: var(--muted); font-size: 12px; }
    .field input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 0 12px;
      color: var(--ink);
      background: var(--surface);
      outline: 0;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(49,87,213,.12); }
    .content { min-height: calc(100dvh - 60px); display: flex; flex-direction: column; }
    .group-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 18px 14px;
    }
    .group-head h1 { min-width: 0; margin: 0; font-size: 22px; line-height: 1.35; font-weight: 650; letter-spacing: 0; overflow-wrap: anywhere; }
    .group-count { flex: none; color: var(--subtle); font-size: 13px; font-variant-numeric: tabular-nums; }
    .participants { margin: 0 18px; border-top: 1px solid var(--line); }
    .participant {
      display: grid;
      grid-template-columns: 42px minmax(0,1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 68px;
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
    }
    .avatar {
      position: relative;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      overflow: hidden;
      border-radius: 50%;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 13px;
      font-weight: 650;
    }
    .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .participant-copy { min-width: 0; }
    .participant-copy strong { display: block; overflow-wrap: anywhere; font-size: 14px; font-weight: 550; }
    .participant-copy small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .participant-copy small:empty { display: none; }
    .person-state { max-width: 92px; color: var(--subtle); font-size: 12px; text-align: right; overflow-wrap: anywhere; }
    .person-state.succeeded, .person-state.already_signed, .person-state.completed { color: var(--green); }
    .person-state.signing, .person-state.submitting, .person-state.running, .person-state.queued, .person-state.captured { color: var(--accent); }
    .person-state.failed, .person-state.auth_required { color: var(--red); }
    .person-state.manual_required, .person-state.awaiting_input, .person-state.unknown, .person-state.partial { color: var(--orange); }
    .loading-list { padding: 0 18px; }
    .loading-row { height: 68px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
    .loading-row:first-child { border-top: 0; }
    .loading-avatar, .loading-copy span { background: var(--surface-muted); animation: pulse 1.2s ease-in-out infinite; }
    .loading-avatar { width: 42px; height: 42px; border-radius: 50%; }
    .loading-copy { flex: 1; display: grid; gap: 7px; }
    .loading-copy span { width: 38%; height: 10px; border-radius: 3px; }
    .loading-copy span:last-child { width: 63%; height: 8px; }
    @keyframes pulse { 50% { opacity: .5; } }
    .feedback {
      margin: 12px 18px 0;
      border-left: 3px solid var(--accent);
      padding: 8px 10px;
      color: var(--muted);
      background: var(--surface-muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .feedback.success { border-color: var(--green); color: var(--green); background: var(--green-soft); }
    .feedback.error { border-color: var(--red); color: var(--red); background: var(--red-soft); }
    .actions { margin-top: auto; padding: 20px 18px calc(20px + var(--safe-bottom)); }
    .primary-button, .secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 46px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 550;
    }
    .primary-button { color: #fbfcfe; background: var(--accent); }
    .primary-button:active:not(:disabled) { background: var(--accent-hover); transform: translateY(1px); }
    .secondary-button { color: var(--ink); background: var(--surface-muted); }
    button:disabled { opacity: .52; cursor: wait; }
    .primary-button svg, .secondary-button svg { width: 19px; height: 19px; }
    .input-mode { display: none; margin-bottom: 10px; }
    .purpose-input .input-mode { display: block; }
    .input-mode form { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
    .input-mode input {
      min-width: 0;
      height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 0 12px;
      outline: 0;
      font-size: 16px;
    }
    .input-mode button { width: auto; min-width: 82px; }
    .scanner-shell {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
      color: #fff;
      background: #090b0e;
      animation: scanner-in 160ms ease-out;
    }
    .scanner-shell[hidden] { display: none; }
    @keyframes scanner-in { from { opacity: .35; } }
    .scanner-media, .scanner-media video, .scanner-shade { position: absolute; inset: 0; width: 100%; height: 100%; }
    .scanner-media video { object-fit: cover; background: #090b0e; }
    .scanner-shade {
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.58), transparent 21%, transparent 68%, rgba(0,0,0,.72)),
        radial-gradient(circle at center, transparent 0 31%, rgba(0,0,0,.5) 32% 100%);
    }
    .scanner-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 3;
      display: grid;
      grid-template-columns: 40px minmax(0,1fr) 40px;
      align-items: center;
      gap: 12px;
      min-height: calc(56px + var(--safe-top));
      padding: calc(8px + var(--safe-top)) 14px 8px;
    }
    .scanner-header strong { text-align: center; font-size: 15px; font-weight: 550; }
    .scanner-back {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(0,0,0,.28);
    }
    .scanner-back svg { width: 24px; height: 24px; }
    .scan-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .scan-frame {
      position: relative;
      width: min(72vw, 292px);
      aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,.34);
      box-shadow: 0 0 0 1px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .scan-frame::before, .scan-frame::after, .scan-frame span::before, .scan-frame span::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: #fff;
      border-style: solid;
    }
    .scan-frame::before { top: -1px; left: -1px; border-width: 3px 0 0 3px; }
    .scan-frame::after { top: -1px; right: -1px; border-width: 3px 3px 0 0; }
    .scan-frame span::before { bottom: -1px; left: -1px; border-width: 0 0 3px 3px; }
    .scan-frame span::after { right: -1px; bottom: -1px; border-width: 0 3px 3px 0; }
    .scan-line {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6f9bff 18%, #fff 50%, #6f9bff 82%, transparent);
      box-shadow: 0 0 14px rgba(80,130,255,.9);
      animation: scan 2.25s ease-in-out infinite;
    }
    @keyframes scan { 0%,100% { transform: translateY(0); opacity: .55; } 50% { transform: translateY(230px); opacity: 1; } }
    .scan-state {
      position: absolute;
      left: 20px;
      right: 20px;
      top: calc(50% + min(42vw, 174px));
      z-index: 3;
      text-align: center;
      color: rgba(255,255,255,.88);
      font-size: 13px;
      text-shadow: 0 1px 5px rgba(0,0,0,.7);
    }
    .scan-state.error { color: #ffd5d1; }
    .scan-state.success { color: #c8f1db; }
    .scanner-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(88px + var(--safe-bottom));
      padding: 14px 20px calc(18px + var(--safe-bottom));
    }
    .gallery-button {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 68px;
      border: 0;
      color: #fff;
      background: transparent;
      font-size: 12px;
    }
    .gallery-button span {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,.14);
      backdrop-filter: blur(8px);
    }
    .gallery-button svg { width: 22px; height: 22px; }
    .scan-success {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: none;
      place-content: center;
      gap: 12px;
      color: #fff;
      text-align: center;
      background: rgba(9,11,14,.5);
      backdrop-filter: blur(3px);
    }
    .scanner-shell.success .scan-success { display: grid; }
    .scanner-shell.success .scan-line { animation-play-state: paused; opacity: .25; }
    .success-icon {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto;
      border-radius: 50%;
      color: #fff;
      background: var(--green);
    }
    .success-icon svg { width: 38px; height: 38px; }
    .scan-success strong { font-size: 17px; font-weight: 550; }
    .scan-success small { color: rgba(255,255,255,.78); font-size: 13px; }
    @media (max-width: 520px) {
      main { border-inline: 0; }
      .group-head { padding-top: 20px; }
    }
    @media (min-width: 621px) {
      body { padding-block: 16px; }
      .app-header { width: min(100%, 620px); margin: 0 auto; border: 1px solid var(--line); border-bottom: 0; }
      main { min-height: calc(100dvh - 93px); border: 1px solid var(--line); }
      .content { min-height: calc(100dvh - 93px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <script src="/assets/qr-decoder.js"></script>
  <script>
    const token = location.hash.slice(1);
    const remote = location.pathname.startsWith('/qr/');
    const base = remote ? '/api/qr' : '/api/share';
    const endpoint = path => base + (remote && !path ? '/session' : path);
    const el = id => document.getElementById(id);
    const CAPTURE_HOLD_MS = 1900;
    const labels = {
      waiting:'等待扫码', captured:'已接收', pending:'待执行', queued:'排队中', running:'核验中',
      submitting:'提交中', signing:'签到中', succeeded:'已签到', already_signed:'已签到',
      completed:'已完成', partial:'部分完成', awaiting_input:'待补充', failed:'失败',
      auth_required:'待授权', expired:'已结束', manual_required:'需人工处理', unknown:'待核对',
      cancelled:'已取消', revoked:'已撤销'
    };
    let state = null;
    let busy = false;
    let active = true;
    let stream = null;
    let scanFrame = null;
    let scannerOpen = false;
    let lastDecodeAt = 0;

    function pin() {
      return el('pin').value.trim();
    }

    function headers() {
      return {
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
        ...(pin() ? {'X-Mumu-Pin': pin()} : {})
      };
    }

    function badge(label, kind = '') {
      el('state').textContent = label;
      el('state').className = 'badge ' + kind;
    }

    function feedback(message = '', kind = '') {
      el('feedback').textContent = message;
      el('feedback').className = 'feedback ' + kind;
      el('feedback').hidden = !message;
    }

    function setLocked(locked) {
      el('app').classList.toggle('locked', locked);
      if (locked) badge('需要 PIN');
    }

    async function call(path, body) {
      const response = await fetch(endpoint(path), {
        method: body ? 'POST' : 'GET',
        headers: headers(),
        body: body ? JSON.stringify(body) : undefined,
        cache: 'no-store'
      });
      let data = {};
      try { data = await response.json(); } catch {}
      if (!response.ok) {
        if (response.status === 401) setLocked(true);
        throw new Error(typeof data.detail === 'string' ? data.detail : '请求未通过，请稍后重试');
      }
      return data;
    }

    function initials(name) {
      const chars = Array.from(String(name || '同学').trim());
      return chars.slice(0, 2).join('');
    }

    function personRow(item) {
      const row = document.createElement('article');
      row.className = 'participant';

      const avatar = document.createElement('span');
      avatar.className = 'avatar';
      avatar.textContent = initials(item.name);
      if (item.avatar) {
        const image = document.createElement('img');
        image.src = item.avatar;
        image.alt = '';
        image.addEventListener('error', () => image.remove(), {once:true});
        avatar.append(image);
      }

      const copy = document.createElement('span');
      copy.className = 'participant-copy';
      const name = document.createElement('strong');
      name.textContent = item.name || '同学';
      const message = document.createElement('small');
      message.textContent = item.status === 'waiting' ? '' : (item.message || '');
      copy.append(name, message);

      const status = document.createElement('span');
      status.className = 'person-state ' + String(item.status || '');
      status.textContent = labels[item.status] || item.status || '等待';

      row.append(avatar, copy, status);
      return row;
    }

    function render(data) {
      state = data;
      const total = Number(data.total || 0);
      const completed = Number(data.completed || 0);
      const locked = Boolean(data.requires_pin && !data.unlocked);
      el('summary').textContent = data.group_name || data.course || '扫码签到';
      el('count').textContent = completed + ' / ' + total;
      el('loading').hidden = true;
      el('app').classList.toggle('purpose-input', data.purpose === 'input');
      el('scanButton').hidden = data.purpose === 'input';
      setLocked(locked);

      if (!locked) {
        el('items').replaceChildren(...(data.items || []).map(personRow));
        if (data.status === 'completed') {
          badge('已完成', 'success');
          feedback('签到已完成', 'success');
        } else if (data.status === 'partial') {
          badge('部分完成', 'warn');
          feedback('部分账号未完成，请查看成员状态', 'error');
        } else if (data.status === 'failed') {
          badge('未完成', 'error');
          feedback('本次签到未完成，可以重新扫码', 'error');
        } else if (data.status === 'waiting' && (data.items || []).some(item => item.status === 'failed')) {
          badge('未匹配', 'error');
          feedback('没有匹配到当前二维码活动，可以重新扫码', 'error');
        } else if (['captured','queued','signing'].includes(data.status)) {
          badge(labels[data.status] || '处理中', 'live');
          feedback('');
        } else {
          badge(labels[data.status] || '等待扫码');
          feedback('');
        }
      }
    }

    async function refresh() {
      if (!active) return;
      try {
        const data = await call('');
        render(data);
        if (!data.persistent && ['completed','partial','failed','expired','revoked'].includes(data.status)) {
          active = false;
        }
        if (data.status === 'revoked' || data.status === 'expired') active = false;
      } catch (error) {
        feedback(error.message, 'error');
        badge('链接不可用', 'error');
        active = false;
      } finally {
        if (active) {
          const currentStatus = state?.status;
          const delay = ['captured','queued','signing'].includes(currentStatus)
            ? 550
            : currentStatus === 'waiting' ? 1200 : 1800;
          window.setTimeout(refresh, delay);
        }
      }
    }

    async function unlock() {
      if (busy) return;
      busy = true;
      el('unlock').disabled = true;
      try {
        await call('/unlock', {});
        setLocked(false);
        active = true;
        await refresh();
      } catch (error) {
        feedback(error.message, 'error');
      } finally {
        busy = false;
        el('unlock').disabled = false;
      }
    }

    function setScanState(message, kind = '') {
      el('scanState').textContent = message;
      el('scanState').className = 'scan-state ' + kind;
    }

    function stopCamera() {
      if (scanFrame) cancelAnimationFrame(scanFrame);
      scanFrame = null;
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      el('video').srcObject = null;
    }

    function closeScanner() {
      if (busy) return;
      scannerOpen = false;
      stopCamera();
      el('scanner').hidden = true;
      el('scanner').classList.remove('success');
      setScanState('正在打开摄像头…');
      document.body.style.overflow = '';
    }

    function openScanner() {
      if (scannerOpen || busy) return;
      scannerOpen = true;
      el('scanner').hidden = false;
      el('scanner').classList.remove('success');
      document.body.style.overflow = 'hidden';
      setScanState('正在打开摄像头…');
      startCamera();
    }

    function scanNextFrame() {
      if (scanFrame || !scannerOpen || busy || !stream) return;
      scanFrame = requestAnimationFrame(now => {
        scanFrame = null;
        if (!scannerOpen || busy || !stream) return;
        if (now - lastDecodeAt < 160 || el('video').readyState < 2) {
          scanNextFrame();
          return;
        }
        lastDecodeAt = now;
        const width = el('video').videoWidth;
        const height = el('video').videoHeight;
        if (!width || !height) {
          scanNextFrame();
          return;
        }
        const scale = Math.min(1, 900 / Math.max(width, height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(width * scale));
        canvas.height = Math.max(1, Math.round(height * scale));
        const context = canvas.getContext('2d', {willReadFrequently:true});
        context.drawImage(el('video'), 0, 0, canvas.width, canvas.height);
        const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
        const found = decodeQrCode(pixels.data, pixels.width, pixels.height);
        if (found?.data) {
          capture(found.data, 'camera');
          return;
        }
        scanNextFrame();
      });
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setScanState('无法打开摄像头，可从相册选择', 'error');
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {facingMode:{ideal:'environment'}},
          audio: false
        });
        if (!scannerOpen) {
          stopCamera();
          return;
        }
        el('video').srcObject = stream;
        await el('video').play();
        setScanState('将二维码放入框内');
        lastDecodeAt = 0;
        scanNextFrame();
      } catch (error) {
        stopCamera();
        const denied = ['NotAllowedError','PermissionDeniedError'].includes(error?.name);
        setScanState(denied ? '请允许摄像头权限，或从相册选择' : '无法打开摄像头，可从相册选择', 'error');
      }
    }

    async function capture(text, source) {
      if (!text || busy) return;
      busy = true;
      if (scanFrame) cancelAnimationFrame(scanFrame);
      scanFrame = null;
      el('closeScanner').disabled = true;
      el('scanner').classList.add('success');
      setScanState('正在提交…');
      let accepted = false;
      try {
        const data = await call('/capture', {text, source});
        accepted = true;
        render(data);
        setScanState('二维码已接收', 'success');
        active = true;
        refresh();
        await new Promise(resolve => window.setTimeout(resolve, CAPTURE_HOLD_MS));
        stopCamera();
        el('scanner').classList.remove('success');
        scannerOpen = false;
        el('scanner').hidden = true;
        document.body.style.overflow = '';
      } catch (error) {
        el('scanner').classList.remove('success');
        setScanState(error.message, 'error');
      } finally {
        busy = false;
        el('closeScanner').disabled = false;
        if (!accepted && scannerOpen && stream) scanNextFrame();
      }
    }

    async function decodeFile(file) {
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) {
        setScanState('图片不得超过 4 MB', 'error');
        return;
      }
      setScanState('正在识别图片…');
      try {
        const bitmap = await createImageBitmap(file);
        try {
          const scale = Math.min(1, 1800 / Math.max(bitmap.width, bitmap.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(bitmap.width * scale));
          canvas.height = Math.max(1, Math.round(bitmap.height * scale));
          const context = canvas.getContext('2d', {willReadFrequently:true});
          context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
          const found = decodeQrCode(pixels.data, pixels.width, pixels.height);
          if (!found?.data) throw new Error('图片中未识别到二维码');
          await capture(found.data, 'image');
        } finally {
          bitmap.close();
        }
      } catch (error) {
        setScanState(error.message || '图片识别失败', 'error');
        if (stream) scanNextFrame();
      }
    }

    async function submitInput(event) {
      event.preventDefault();
      if (busy) return;
      busy = true;
      try {
        const data = await call('/execute', {
          code: el('code').value.trim(),
          qr: '',
          location: null
        });
        render(data);
        feedback('已提交，正在核验', 'success');
      } catch (error) {
        feedback(error.message, 'error');
      } finally {
        busy = false;
      }
    }

    el('unlock').addEventListener('click', unlock);
    el('pin').addEventListener('keydown', event => {
      if (event.key === 'Enter') unlock();
    });
    el('scanButton').addEventListener('click', openScanner);
    el('closeScanner').addEventListener('click', closeScanner);
    el('gallery').addEventListener('click', () => el('image').click());
    el('image').addEventListener('change', async event => {
      try {
        await decodeFile(event.target.files[0]);
      } finally {
        event.target.value = '';
      }
    });
    el('inputForm').addEventListener('submit', submitInput);
    window.addEventListener('beforeunload', stopCamera);
    window.addEventListener('pagehide', stopCamera);

    if (!token) {
      badge('链接无效', 'error');
      feedback('链接缺少授权信息，请重新生成', 'error');
      active = false;
    } else {
      refresh();
    }
  </script>
</body>
</html>
