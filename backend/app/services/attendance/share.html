<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>批量签到 · Assignment Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#192333;font:14px/1.6 system-ui,sans-serif}main{max-width:660px;margin:48px auto;padding:28px;background:white;border:1px solid #e2e6ed;border-radius:8px}h1{font-size:22px;margin:0 0 8px}p{color:#667184}label{display:block;margin:20px 0 8px}input,textarea{width:100%;border:1px solid #d8dfe7;border-radius:5px;padding:10px;font:inherit}button{border:0;border-radius:5px;background:#3b4ed8;color:white;padding:11px 18px;font:inherit;cursor:pointer;margin-top:20px}button:disabled{opacity:.5;cursor:wait}.row{border-top:1px solid #e8ecf0;padding:14px 0;display:flex;justify-content:space-between;gap:12px}.row small{display:block;color:#728094}.row b{font-weight:500;white-space:nowrap}.status{margin:18px 0;color:#445570}.error{color:#b62d3e}.success{color:#14775e}footer{font-size:12px;color:#728094;margin-top:20px}
</style></head><body><main><h1>批量签到</h1><p id="summary">正在读取授权范围…</p><div id="items"></div><form id="form"><label for="code">签到码／手势码</label><input id="code" inputmode="numeric" maxlength="16" autocomplete="off"><label for="qr">签到二维码内容</label><textarea id="qr" rows="3" maxlength="4096" placeholder="粘贴学习通签到二维码中的链接"></textarea><label for="image">导入签到二维码</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><fieldset id="locationFields" hidden><legend>本次签到位置</legend><label for="latitude">纬度</label><input id="latitude" type="number" min="-90" max="90" step="any"><label for="longitude">经度</label><input id="longitude" type="number" min="-180" max="180" step="any"><label for="address">实际位置</label><input id="address" maxlength="200"><small>仅用于你确认处于此位置的所选账号。</small></fieldset><button id="submit" type="submit" disabled>批量提交</button></form><div id="message" class="status" role="status"></div><footer id="expires"></footer></main>
<script src="/assets/jsQR.js"></script>
<script>
const token=location.hash.slice(1), headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
let active=true,busy=false;
const labels={pending:'待执行',queued:'排队中',running:'核验中',submitting:'提交中',succeeded:'已签到',already_signed:'已签到',awaiting_input:'待补充',failed:'失败',auth_required:'待授权',expired:'已结束',manual_required:'需本人处理',unknown:'待核对',cancelled:'已取消'};
const el=id=>document.getElementById(id);
async function call(path,body){const response=await fetch('/api/share'+path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'输入格式不正确，请核对签到信息');return data}
function render(data){el('locationFields').hidden=!data.items.some(item=>item.kind==='location'&&!['succeeded','already_signed','expired'].includes(item.status));el('summary').textContent='已签到 '+data.completed+' / '+data.total;el('items').replaceChildren(...data.items.map(item=>{const row=document.createElement('div');row.className='row';const text=document.createElement('span');text.textContent=item.name+' · '+item.course;const detail=document.createElement('small');detail.textContent=item.message;const state=document.createElement('b');state.textContent=labels[item.status]||item.status;if(['succeeded','already_signed'].includes(item.status))state.className='success';text.append(detail);row.append(text,state);return row}));el('submit').disabled=busy||data.status==='running'||data.status==='needs_review'||!data.items.some(item=>['pending','awaiting_input','failed','auth_required','cancelled'].includes(item.status));if(data.expires_at)el('expires').textContent='授权到期：'+new Date(data.expires_at*1000).toLocaleString()}
async function refresh(){if(!active)return;try{render(await call(''));}catch(error){el('message').textContent=error.message;el('message').classList.add('error');el('submit').disabled=true;active=false}finally{if(active)setTimeout(refresh,2500)}}
el('form').addEventListener('submit',async event=>{event.preventDefault();if(busy)return;busy=true;el('submit').disabled=true;el('message').textContent='';try{render(await call('/execute',{code:el('code').value.trim(),qr:el('qr').value.trim(),location:(!el('locationFields').hidden&&(el('latitude').value||el('longitude').value||el('address').value.trim()))?{latitude:el('latitude').value?Number(el('latitude').value):null,longitude:el('longitude').value?Number(el('longitude').value):null,address:el('address').value.trim(),source:'manual'}:null}));el('message').textContent='已提交，正在逐账号核验';}catch(error){el('message').textContent=error.message;}finally{busy=false}});refresh();

el('image').addEventListener('change',async event=>{let bitmap;try{const file=event.target.files[0];if(!file)return;if(file.size>4*1024*1024)throw new Error('图片不得超过 4 MB');bitmap=await createImageBitmap(file);const scale=Math.min(1,1800/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const context=canvas.getContext('2d',{willReadFrequently:true});context.drawImage(bitmap,0,0,canvas.width,canvas.height);const pixels=context.getImageData(0,0,canvas.width,canvas.height);const result=jsQR(pixels.data,pixels.width,pixels.height);if(!result?.data)throw new Error('图片中未识别到二维码');el('qr').value=result.data;el('message').textContent='二维码已识别';}catch(error){el('message').textContent=error.message;}finally{bitmap?.close();event.target.value='';}});
</script></body></html>
